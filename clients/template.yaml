# Client Questionnaire Template
# Fill out this file, then run:
# python3 scripts/generate.py --client clients/blessing.yaml --env production

profile_name: blessing          # Profile directory name
profile_type: client             # Must be "client" or "admin"

# Telegram / Routing
telegram_id: "7200670846"         # Client's Telegram user ID
telegram_chats: "7200670846,-1004345112293"
home_channel: "5446665128"         # Admin user ID for notifications

# Client Identity
client_name: "Blessing"
client_role: "Customer Success & Operations"
